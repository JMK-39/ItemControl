loader=neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neoforge_version=26.1.2.112
neoforge_version_range=[26.1.2.0,)
loader_version_range=[1,)
# Java the game runs on: bytecode level and usable language/API
java_version=25
# Resource pack format 84, data pack format 101; 26.1 packs declare a format range.
pack_min_format=84
pack_max_format=101
# Existing checker limitations, acknowledged without removing the runtime Mixins.
known_mixin_issues=

kubejs_version_range=[26.1.2-8.0,)
# Third-party mods compiled against: JEI 29.43.0.106 and KubeJS 26.1.2-8.0.6. KubeJS stays compile-only: its 26.1
# build injects into the synchronous WorldLoader.load that 26.1.2 replaced, so it cannot start here.
mod_dependencies=maven.modrinth:jei:iub7wR3J, compileOnly:maven.modrinth:kubejs:FzLyIIBB, compileOnly:maven.modrinth:rhino:SqkDvOLG

# 26.1 keeps enchantability and eating time in item components, set by ItemPropertyOverrides.applyDefaultComponents.
unavailable_mixins=ItemPropertyMixins$ItemProperties
